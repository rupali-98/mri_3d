services:
  mri3d:
    build:
      context: .
      args:
        # CUDA build of PyTorch; set TORCH_INDEX_URL=https://download.pytorch.org/whl/cpu for a CPU-only machine
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu128}
    image: mri3d:latest
    container_name: mri3d
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --IdentityProvider.token=
    ports:
      - "8888:8888"  # JupyterLab
      - "5000:5000"  # MLflow UI
    volumes:
      - .:/workspace
      - claude-config:/home/dev/.claude  # keeps Claude login + settings across rebuilds
    environment:
      - ANTHROPIC_API_KEY  # optional: passed through from the host shell if set
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: "2gb"  # PyTorch DataLoader workers need more shared memory than the default
    stdin_open: true
    tty: true

volumes:
  claude-config:
